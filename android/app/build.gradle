apply plugin: 'com.android.application'

// Release signing (Google Play upload key). Never committed: read from android/keystore.properties
// (git-ignored; see ANDROID_RELEASE.md) or, in CI, from CAMPUSOS_UPLOAD_* environment variables.
// Without it, bundleRelease produces an UNSIGNED bundle that Google Play will not accept.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProperties.load(it) }
def signingValue = { String key, String env -> keystoreProperties.getProperty(key) ?: System.getenv(env) }
def uploadStoreFile = signingValue('storeFile', 'CAMPUSOS_UPLOAD_STORE_FILE')
def hasUploadKey = uploadStoreFile && signingValue('storePassword', 'CAMPUSOS_UPLOAD_STORE_PASSWORD') && signingValue('keyAlias', 'CAMPUSOS_UPLOAD_KEY_ALIAS') && signingValue('keyPassword', 'CAMPUSOS_UPLOAD_KEY_PASSWORD')

android {
    namespace = "com.lingeshsashikumar.campusos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lingeshsashikumar.campusos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(project.findProperty('campusosVersionCode') ?: '1')
        versionName project.findProperty('campusosVersionName') ?: '1.0.0'
        manifestPlaceholders = [appLinkHost: project.findProperty('campusosAppLinkHost') ?: 'www.campusos.dev']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            release {
                storeFile rootProject.file(uploadStoreFile)
                storePassword signingValue('storePassword', 'CAMPUSOS_UPLOAD_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'CAMPUSOS_UPLOAD_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'CAMPUSOS_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadKey) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Refuse to package a release without the production web bundle (pnpm android:sync builds it).
tasks.matching { it.name in ['preReleaseBuild'] }.configureEach {
    doFirst {
        def index = file('src/main/assets/public/index.html')
        if (!index.exists()) throw new GradleException('Web bundle missing. Run `pnpm android:sync` first.')
        def config = file('src/main/assets/capacitor.config.json').text
        if (config.contains('"server"') && config.contains('"url"')) throw new GradleException('capacitor.config has server.url set; release builds must use the bundled app.')
        if (!hasUploadKey) logger.warn('CampusOS: no upload key configured (android/keystore.properties). The release bundle will be UNSIGNED and cannot be uploaded to Google Play.')
    }
}
